{% extends 'base.html' %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:560px"><div class="card-body empty-state">
  <div class="page-eyebrow">HTTP 403</div>
  <div class="es-title fs-4">Access denied</div>
  <p>Your role is not permitted to perform this action. Nothing was changed.</p>
  {% if user.is_authenticated %}<a class="btn btn-primary" href="{% url 'home' %}">Back to my workspace</a>
  {% else %}<a class="btn btn-primary" href="{% url 'login' %}">Sign in</a>{% endif %}
</div></div>
{% endblock %}
